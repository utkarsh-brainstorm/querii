name: Build and Release Querii

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgirepository1.0-dev gcc libcairo2-dev pkg-config python3-dev gir1.2-gtk-3.0
        sudo apt-get install -y gir1.2-webkit2-4.1 || sudo apt-get install -y gir1.2-webkit2-4.0

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pywebview reportlab openpyxl xlrd pyinstaller

    - name: Build Executable (Linux)
      if: runner.os == 'Linux'
      run: |
        pyinstaller --noconfirm --onedir --windowed \
          --add-data "web:web" \
          --name querii-linux \
          main.py
        
        cd dist
        tar -czf payload.tar.gz querii-linux
        
        cat << 'EOF' > querii-linux-executable
        #!/bin/bash
        TARGET_DIR="$HOME/.local/share/querii/bin"
        mkdir -p "$TARGET_DIR"
        echo "Unpacking Querii to $TARGET_DIR..."
        MATCH=$(grep -a -n '^__ARCHIVE_BELOW__$' "$0" | cut -d: -f1)
        tail -n +$((MATCH + 1)) "$0" | tar -xz -C "$TARGET_DIR" --overwrite
        exec "$TARGET_DIR/querii-linux/querii-linux" "$@"
        exit $?
        __ARCHIVE_BELOW__
        EOF
        
        cat payload.tar.gz >> querii-linux-executable
        chmod +x querii-linux-executable
        mv querii-linux-executable querii-linux

    # ── macOS: single-file executable ──────────────────────────────────
    - name: Build Executable (macOS)
      if: runner.os == 'macOS'
      run: |
        pyinstaller --noconfirm --onefile \
          --add-data "web:web" \
          --name querii-macos \
          main.py

    # ── Windows: onedir bundle (required by Inno Setup) ────────────────
    - name: Build Executable (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconfirm --onedir --windowed `
          --add-data "web;web" `
          --name querii-windows `
          main.py

    # ── Windows: build installer with Inno Setup ───────────────────────
    - name: Build Windows Installer
      if: runner.os == 'Windows'
      run: |
        choco install innosetup --no-progress -y
        iscc installer.iss

    - name: Upload Artifacts (Linux)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: binaries-Linux
        path: dist/querii-linux
        retention-days: 1

    - name: Upload Artifacts (macOS)
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: binaries-macOS
        path: dist/querii-macos
        retention-days: 1

    - name: Upload Artifacts (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: binaries-Windows
        path: dist/querii-windows-setup.exe
        retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          pattern: binaries-*
          merge-multiple: true

      - name: List downloaded files
        run: find binaries -type f

      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: V3-beta
          name: Querii V3 Beta
          fail_on_unmatched_files: false
          body: |
            ## Querii V3 Beta

            A powerful local sheet-to-SQL analytics desktop app — no server, no cloud, just your data.

            ### 🆕 What's new in V3 Beta
            - 📄 **PDF Export Dialog** — Custom title, save folder (remembered!), A4/A3/Letter, portrait/landscape, scale, continuous mode
            - 💾 **Persistent Data** — Your imported tables and settings survive app updates and restarts
            - 🪟 **Windows Installer** — Proper `querii-windows-setup.exe` with Start Menu and Desktop shortcuts
            - 🔧 **Filter buttons fixed** — AND/OR and ✕ close buttons in nested conditions work correctly
            - 🗂 **Schema always visible** — Schema panel updates instantly when selecting any table from the File List
            - 📝 **Dynamic SQL Templates** — Auto-fills table and column names from your active selection
            - ↩️ **Ctrl+Z / Ctrl+Y** — Full undo/redo in the SQL editor
            - 🖱 **Click column headers to sort** — Click any result column to sort ascending/descending
            - ✍️ **Selectable text** — Table cell and schema content can be selected and copied
            - ⚡ **Linux lag fixed** — Mousemove listener scoping matches the parent project for zero idle overhead

            ### 📥 Downloads
            Pick the file for your OS — no Python or dependencies needed.

            | Platform | File | Notes |
            |---|---|---|
            | 🐧 Linux | `querii-linux` | Single binary. `chmod +x querii-linux && ./querii-linux` |
            | 🍎 macOS | `querii-macos` | Single binary. `chmod +x querii-macos && ./querii-macos` |
            | 🪟 Windows | `querii-windows-setup.exe` | Run the installer — adds to Start Menu & optional Desktop icon |

            > **Data location:** Your database and settings are stored in your user profile, never inside the app folder.
            > - Windows: `%APPDATA%\Querii\`
            > - Linux: `~/.local/share/querii/`
            > - macOS: `~/Library/Application Support/Querii/`
          files: |
            binaries/querii-linux
            binaries/querii-macos
            binaries/querii-windows-setup.exe
