name: Build and Release Querii

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgirepository1.0-dev gcc libcairo2-dev pkg-config python3-dev gir1.2-gtk-3.0
        sudo apt-get install -y gir1.2-webkit2-4.1 || sudo apt-get install -y gir1.2-webkit2-4.0

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pywebview reportlab openpyxl xlrd pyinstaller

    # ── Linux: shiv ZipApp / macOS: PyInstaller onedir ──────────────
    - name: Build Executable (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          # Build a lightweight pure-Python ZipApp for Linux. 
          # Bypasses all PyInstaller GTK library stripping/sandbox crashes.
          python3 -m pip install shiv pywebview reportlab openpyxl xlrd
          mkdir dist
          shiv -p '/usr/bin/python3' -o dist/querii-linux pywebview reportlab openpyxl xlrd --site-packages . -e main:main
          cd dist
          tar -czf ../querii-Linux.tar.gz querii-linux
        else
          # macOS uses standard PyInstaller
          pip install pywebview reportlab openpyxl xlrd pyinstaller
          pyinstaller --noconfirm --onedir --windowed \
            --add-data "web:web" \
            --name querii-macOS \
            main.py
          cd dist
          tar -czf ../querii-macOS.tar.gz querii-macOS
        fi

    # ── Windows: onedir bundle (required by Inno Setup) ────────────────
    - name: Build Executable (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconfirm --onedir --windowed `
          --add-data "web;web" `
          --name querii-windows `
          main.py

    # ── Windows: build installer with Inno Setup ───────────────────────
    - name: Build Windows Installer
      if: runner.os == 'Windows'
      run: |
        choco install innosetup --no-progress -y
        iscc installer.iss

    - name: Upload Artifacts (Linux/macOS)
      if: runner.os != 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: binaries-${{ runner.os }}
        path: querii-${{ runner.os }}.tar.gz
        retention-days: 1

    - name: Upload Artifacts (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: binaries-Windows
        path: dist/querii-windows-setup.exe
        retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          pattern: binaries-*
          merge-multiple: true

      - name: List downloaded files
        run: find binaries -type f

      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: V3.1-beta
          name: Querii V3.1 Beta
          fail_on_unmatched_files: false
          body: |
            ## Querii V3.1 Beta

            A powerful local sheet-to-SQL analytics desktop app — no server, no cloud, just your data.

            ### 🆕 What's new in V3.1 Beta
            - 🎨 **Custom HTML/CSS PDF** — Styled PDF exports via headless Chromium. Toggle with "🎨 Use custom HTML/CSS template" in the PDF dialog. Falls back to ReportLab if Chromium isn't installed
            - 📝 **PDF Style settings tab** — Save a default CSS template and enable Developer mode (always shows CSS editor in PDF dialog)
            - 📋 **Copy AI Requirement** — One-click copy of a detailed prompt describing all CSS classes, HTML structure, and data placeholders — paste into any AI to generate custom styles
            - 🔍 **Schema sidebar filtered** — The left Schema panel now shows only your currently selected tables, not every table in the DB
            - 📋 **SQL Schema copy button** — "Copy All Schema" button in the Custom Report quick-reference panel
            - ⚡ **Instant column sort** — Clicking a column header now sorts in-memory (no re-query) with ▲/▼ indicators
            - 📋 **Copy CSV button** — New "📋 Copy" button next to CSV export — copies all results to clipboard as CSV text
            - ✅ **Query Log fixed** — "Use" in Query Log now pastes the SQL into the editor AND copies to clipboard, then focuses the SQL panel

            ### 📥 Downloads
            Pick the file for your OS — no Python or dependencies needed.

            | Platform | File | Notes |
            |---|---|---|
            | 🐧 Linux | `querii-Linux.tar.gz` | Extract the archive, then run the `querii-Linux` executable inside |
            | 🍎 macOS | `querii-macOS.tar.gz` | Extract the archive, then run the `querii-macOS` executable inside |
            | 🪟 Windows | `querii-windows-setup.exe` | Run the installer — adds to Start Menu & optional Desktop icon |

            > **Data location:** Your database and settings are stored in your user profile, never inside the app folder.
            > - Windows: `%APPDATA%\Querii\`
            > - Linux: `~/.local/share/querii/`
            > - macOS: `~/Library/Application Support/Querii/`
          files: |
            binaries/*.tar.gz
            binaries/querii-windows-setup.exe

