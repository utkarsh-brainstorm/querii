name: Build and Release Querii

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-13, macos-14, windows-latest]
      fail-fast: false

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgirepository1.0-dev gcc libcairo2-dev pkg-config python3-dev gir1.2-gtk-3.0
        sudo apt-get install -y gir1.2-webkit2-4.1 || sudo apt-get install -y gir1.2-webkit2-4.0

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pywebview reportlab openpyxl xlrd pyinstaller

    # ── Linux: shiv ZipApp / macOS: PyInstaller onedir ──────────────
    - name: Build Executable (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          # Build a lightweight pure-Python ZipApp for Linux. 
          python3 -m pip install shiv pywebview reportlab openpyxl xlrd
          mkdir -p dist
          shiv -p '/usr/bin/python3' -o dist/querii-linux pywebview reportlab openpyxl xlrd --site-packages . -e main:main
          cd dist
          tar -czf ../querii-Linux.tar.gz querii-linux
        else
          # macOS: build for current architecture (x86_64 or arm64)
          ARCH=$(uname -m)
          pip install pywebview reportlab openpyxl xlrd pyinstaller pillow
          pyinstaller --noconfirm --onedir --windowed \
            --icon app_icon.png \
            --add-data "web:web" \
            --add-data "app_icon.png:." \
            --name "querii-macOS-${ARCH}" \
            main.py
          cd dist
          tar -czf "../querii-macOS-${ARCH}.tar.gz" "querii-macOS-${ARCH}"
        fi

    # ── Windows: onedir bundle (required by Inno Setup) ────────────────
    - name: Build Executable (Windows)
      if: runner.os == 'Windows'
      run: |
        pip install pythonnet pillow
        pyinstaller --noconfirm --onedir --windowed `
          --icon app_icon.ico `
          --add-data "web;web" `
          --add-data "app_icon.ico;." `
          --add-data "app_icon.png;." `
          --hidden-import clr `
          --hidden-import clr_loader `
          --hidden-import pythonnet `
          --name querii-windows `
          main.py

    # ── Windows: build installer with Inno Setup ───────────────────────
    - name: Build Windows Installer
      if: runner.os == 'Windows'
      run: |
        choco install innosetup --no-progress -y
        iscc installer.iss

    - name: Upload Artifacts (Linux/macOS)
      if: runner.os != 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: binaries-${{ matrix.os }}
        path: querii-*.tar.gz
        retention-days: 1

    - name: Upload Artifacts (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: binaries-Windows
        path: dist/querii-windows-setup.exe
        retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          pattern: binaries-*
          merge-multiple: true

      - name: List downloaded files
        run: find binaries -type f

      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.0-beta' }}
          name: Querii Version 5.0-beta (Official Release)
          fail_on_unmatched_files: false
          body: |
            ## ⚡ Querii Version 5.0-beta (Official Release)

            **Querii Version 5.0-beta** delivers an architectural evolution with sequential in-editor AI execution, real-time agentic thinking steppers with self-correction, transactional multi-statement SQL script execution, autonomous provider priority queue failover (OpenRouter, Gemini, NVIDIA NIM), bidirectional table selection synchronization, accessible high-contrast theming, and complete 4-platform native compilation (Linux, macOS Apple Silicon ARM64, macOS Intel x86_64, Windows Setup with uninstaller).

            ---

            ### 🚀 What's New in Version 5.0-beta

            #### 1. 🎬 Sequential In-Editor AI Execution & Visual Screen Feedback
            - **Live Editor Streaming**: When the AI assistant generates multi-step workflows (e.g. creating tables, seeding mock data, and querying results), queries are sequentially loaded into `#sql-editor` and executed on screen in front of the user with live line synchronization.
            - **Sequential Pipeline**: Executes Step 1 live (mutations/rows populate the data grid and schema tree), waits a 700ms visual transition, loads Step 2 into the editor, and executes it so the user actually sees every step happening live.
            - **Interactive Multi-Card Chat UI**: Every generated query receives its own dedicated card in the chat bubble equipped with `⚡ Auto-executed in Editor`, `📋 Copy`, `↗ Paste to Editor`, and `▶ Run in Editor` action buttons.
            - **Clean Human Prose**: Internal agentic artifacts (`Thought:`, `Action:`, `Action Input:`) are strictly stripped from chat messages; internal reasoning is cleanly nested inside expandable accordions.

            #### 2. ⚡ Real-Time Thinking Stepper & Self-Correcting ReAct Agent
            - **Live Execution Stepper**: Backend IPC broadcasts step-by-step agent transitions (`thinking`, `executing`, `done`, `error`) to the frontend in real-time with pulsing activity dots, step counters, tool execution spinners, and observation summaries.
            - **Closed-Loop Self-Correction**: When SQLite encounters syntax errors or missing attributes, `db_execute_sql` feeds structured error diagnostics back to the agent loop, allowing the model to analyze the error, refine its query, and verify the fix before finalizing output.
            - **Strict Software-Side Security Sandbox**: Whitelisted execution strictly blocks `ATTACH DATABASE`, `load_extension`, shell commands, filesystem escapes, or dropping internal system tables.

            #### 3. 📜 Transactional Multi-Statement SQL Script Execution
            - **Quote- & Comment-Aware SQL Splitter**: Custom tokenizer parses complex multi-statement SQL scripts while preserving single/double quotes, backticks, `--` line comments, and `/*...*/` block comments.
            - **Atomic Multi-Statement Transactions**: Executes multi-statement DDL/DML batches inside `BEGIN TRANSACTION ... COMMIT` so scripts like `CREATE TABLE ...; INSERT INTO ...; CREATE INDEX ...;` execute cleanly without throwing *"You can only execute one statement at a time"*.
            - **Accurate Changes Tracking**: Tracks `conn.total_changes` before and after execution to capture rowcounts from recursive CTEs (`WITH RECURSIVE ... INSERT`) and bulk inserts.
            - **Instant Schema Sync & Grid Display**: Auto-queries newly created/populated tables and populates the data table grid while automatically selecting the table in the schema and left panel.

            #### 4. 🌐 Multi-Provider AI Fallback Priority Queue & Auto-Healing
            - **Priority Queue Failover**: Configure seamless failover across OpenRouter, Google Gemini, and NVIDIA NIM. If a provider hits HTTP 429 quota limits or network errors, requests automatically failover down the queue.
            - **Auto-Healing Providers**:
              - *NVIDIA NIM*: Directly embeds top-level `chat_template_kwargs: {"enable_thinking": True}` with automatic HTTP 400 auto-healing retries.
              - *OpenRouter*: Automatically migrates deprecated free slugs to `openrouter/free` with on-the-fly auto-retry.
              - *Gemini*: Automatically failovers from `gemini-2.5-flash` to `gemini-2.0-flash` on rate-limits.
            - **Expanded 8,192 Token Window**: Prevents truncation on massive table definitions and dense analytical outputs.

            #### 5. 🔄 Bidirectional Table Selection Synchronization
            - Centralized selection state coordinates the File menu (`#modal-filelist`), Left panel selector (`#table-select`), AI context selector (`#ai-context-table-sel`), and Schema tree (`#schema-tree`). Switching tables anywhere synchronizes the entire application immediately.

            #### 6. 🧮 Advanced Query Builder Operators & State-Preserving Sort
            - **Extended HAVING Operators**: Supports `=`, `!=`, `>`, `>=`, `<`, `<=`, `BETWEEN`, `NOT BETWEEN`, `IS NULL`, `IS NOT NULL`, `LIKE`, and `IN` with dual-input bounds.
            - **Column-to-Column Comparisons**: Toggle right-hand operands between literal values and table column identifiers in WHERE clauses without quotes.
            - **In-Memory Sort**: Sorting column headers synthesizes `ORDER BY` on in-memory `_lastExecutedSql` without modifying the user's active SQL editor text or Visual Builder state.

            #### 7. 🎨 Accessible High-Contrast Theme (Zero White-on-Yellow)
            - Meticulously calibrated high-contrast accessible theme eliminating all `#ffffff` on `#facc15` contrast issues across user chat bubbles, active pills, drag dropzones, and button hover states.

            #### 8. 📦 Complete 4-Platform Native Compilations
            - **Linux (x86_64)**: Lightweight pure-Python ZipApp with zero system GTK conflicts.
            - **macOS Apple Silicon (arm64)**: Native compilation for Apple Silicon M1, M2, M3, and M4 Macs.
            - **macOS Intel (x86_64)**: Native compilation for Intel-based Macs.
            - **Windows (x64)**: Inno Setup executable installer with Start Menu, Desktop shortcuts, and full uninstaller.

            ---

            ### 📥 Downloads

            | Platform | Architecture | File | Notes |
            |---|---|---|---|
            | 🐧 Linux (ZipApp) | x86_64 | `querii-Linux.tar.gz` | Lightweight standalone Python ZipApp |
            | 🍎 macOS | Apple Silicon (M1/M2/M3/M4) | `querii-macOS-arm64.tar.gz` | Extract and run `querii-macOS-arm64` |
            | 🍎 macOS | Intel (x86_64) | `querii-macOS-x86_64.tar.gz` | Extract and run `querii-macOS-x86_64` |
            | 🪟 Windows | x64 | `querii-windows-setup.exe` | Windows Installer with Start Menu, Desktop & Uninstall shortcuts |

            > **Data Persistence:** Your database and configurations persist safely across versions in:
            > - Windows: `%APPDATA%\Querii\`
            > - Linux: `~/.local/share/querii/`
            > - macOS: `~/Library/Application Support/Querii/`
          files: |
            binaries/*.tar.gz
            binaries/querii-windows-setup.exe

