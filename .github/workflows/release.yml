name: Build and Release Querii

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-14, windows-latest]
      fail-fast: false

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgirepository1.0-dev gcc libcairo2-dev pkg-config python3-dev gir1.2-gtk-3.0
        sudo apt-get install -y gir1.2-webkit2-4.1 || sudo apt-get install -y gir1.2-webkit2-4.0

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pywebview reportlab openpyxl xlrd pyinstaller

    # ── Linux: shiv ZipApp / macOS: PyInstaller onedir ──────────────
    - name: Build Executable (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          # Build a lightweight pure-Python ZipApp for Linux. 
          python3 -m pip install shiv pywebview reportlab openpyxl xlrd
          mkdir -p dist
          shiv -p '/usr/bin/python3' -o dist/querii-linux pywebview reportlab openpyxl xlrd --site-packages . -e main:main
          cd dist
          tar -czf ../querii-Linux.tar.gz querii-linux
        else
          # macOS: build for current architecture (x86_64 or arm64)
          ARCH=$(uname -m)
          pip install pywebview reportlab openpyxl xlrd pyinstaller pillow
          pyinstaller --noconfirm --onedir --windowed \
            --icon app_icon.png \
            --add-data "web:web" \
            --add-data "app_icon.png:." \
            --name "querii-macOS-${ARCH}" \
            main.py
          cd dist
          tar -czf "../querii-macOS-${ARCH}.tar.gz" "querii-macOS-${ARCH}"
        fi

    # ── Windows: onedir bundle (required by Inno Setup) ────────────────
    - name: Build Executable (Windows)
      if: runner.os == 'Windows'
      run: |
        pip install pythonnet pillow
        pyinstaller --noconfirm --onedir --windowed `
          --icon app_icon.ico `
          --add-data "web;web" `
          --add-data "app_icon.ico;." `
          --add-data "app_icon.png;." `
          --hidden-import clr `
          --hidden-import clr_loader `
          --hidden-import pythonnet `
          --name querii-windows `
          main.py

    # ── Windows: build installer with Inno Setup ───────────────────────
    - name: Build Windows Installer
      if: runner.os == 'Windows'
      run: |
        choco install innosetup --no-progress -y
        iscc installer.iss

    - name: Upload Artifacts (Linux/macOS)
      if: runner.os != 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: binaries-${{ matrix.os }}
        path: querii-*.tar.gz
        retention-days: 1

    - name: Upload Artifacts (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: binaries-Windows
        path: dist/querii-windows-setup.exe
        retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          pattern: binaries-*
          merge-multiple: true

      - name: List downloaded files
        run: find binaries -type f

      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v4.3' }}
          name: Querii Version 4.3
          fail_on_unmatched_files: false
          body: |
            ## ⚡ Querii Version 4.3 (Official Release)

            **Querii Version 4.3** introduces intelligent continuous substring token column auto-sizing, frictionless reddish deletion animations in CSV Studio, accessible alternating row striping across all 7 UI themes, and complete 4-platform compilation (Linux, macOS ARM64, macOS x86_64, Windows Setup with uninstaller).

            ---

            ### 🚀 What's New in Version 4.3

            #### 1. 📐 Continuous Substring Column Auto-Sizing & Header Cleanliness
            - **Longest Substring Token Width Calculation**: Column widths are now determined by the longest continuous non-whitespace substring across all cell values (excluding attribute name), ensuring that long surnames, identifiers, and large numeric values fit without breaking.
            - **Smart Header Truncation**: When header names exceed content capacity, headers are gracefully truncated (`abcd..`) to perfectly fit the column width.
            - **Automatic Underscore Replacement**: Attribute names containing `_` are automatically cleaned into spaced labels across PDF and Ultra Dev mode.
            - **Preserved User Overrides**: Auto-sizing computes once upon export or entering Ultra Dev Mode; manual slider and header edits are strictly preserved without retriggering recalculation.

            #### 2. 🎬 Non-Blocking Reddish Vanishing Deletion in CSV Studio
            - **Zero Confirmation Dialogs**: Instant row and column deletion with zero annoying popup interruptions.
            - **Smooth Vanishing Animation**: Fast (160ms) soft-red fade-out and collapse transition (`.ce-row-vanishing`, `.ce-col-vanishing`) providing immediate visual feedback as rows and columns snap smoothly into place.

            #### 3. 🎨 Accessible Alternating Contrast Rows in All Themes
            - **Zebra Row Contrast**: Meticulously calibrated `--table-row-alt` subtle contrast across all 7 built-in themes (`Mono`, `Professional`, `Dark`, `Light Blue`, `Minimal`, `Apple Minimal`, `Accessible High-Contrast`), ensuring easy horizontal row-following across wide datasets.

            #### 4. 📦 Complete 4-Platform Native Compilations
            - **Linux (x86_64)**: Lightweight pure-Python ZipApp with zero system GTK conflicts.
            - **macOS Apple Silicon (arm64)**: Native compilation for Apple Silicon M1, M2, M3, and M4 Macs.
            - **macOS Intel (x86_64)**: Native compilation for Intel-based Macs.
            - **Windows (x64)**: Inno Setup executable installer with Start Menu, Desktop shortcuts, and full uninstaller.

            ---

            ### 📥 Downloads

            | Platform | Architecture | File | Notes |
            |---|---|---|---|
            | 🐧 Linux | x86_64 | `querii-Linux.tar.gz` | Extract and run `querii-linux` (zero system GTK conflict) |
            | 🍎 macOS | Apple Silicon (M1/M2/M3/M4) | `querii-macOS-arm64.tar.gz` | Extract and run `querii-macOS-arm64` |
            | 🍎 macOS | Intel (x86_64) | `querii-macOS-x86_64.tar.gz` | Extract and run `querii-macOS-x86_64` |
            | 🪟 Windows | x64 | `querii-windows-setup.exe` | Windows Installer with Start Menu, Desktop & Uninstall shortcuts |

            > **Data Persistence:** Your database and configurations persist safely across versions in:
            > - Windows: `%APPDATA%\Querii\`
            > - Linux: `~/.local/share/querii/`
            > - macOS: `~/Library/Application Support/Querii/`
          files: |
            binaries/*.tar.gz
            binaries/querii-windows-setup.exe

