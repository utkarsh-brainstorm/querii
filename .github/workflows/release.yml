name: Build and Release Querii

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-13, macos-14, windows-latest]
      fail-fast: false

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgirepository1.0-dev gcc libcairo2-dev pkg-config python3-dev gir1.2-gtk-3.0
        sudo apt-get install -y gir1.2-webkit2-4.1 || sudo apt-get install -y gir1.2-webkit2-4.0

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pywebview reportlab openpyxl xlrd pyinstaller

    # ── Linux: shiv ZipApp / macOS: PyInstaller onedir ──────────────
    - name: Build Executable (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          # Build a lightweight pure-Python ZipApp for Linux. 
          python3 -m pip install shiv pywebview reportlab openpyxl xlrd
          mkdir -p dist
          shiv -p '/usr/bin/python3' -o dist/querii-linux pywebview reportlab openpyxl xlrd --site-packages . -e main:main
          cd dist
          tar -czf ../querii-Linux.tar.gz querii-linux
        else
          # macOS: build for current architecture (x86_64 or arm64)
          ARCH=$(uname -m)
          pip install pywebview reportlab openpyxl xlrd pyinstaller
          pyinstaller --noconfirm --onedir --windowed \
            --add-data "web:web" \
            --name "querii-macOS-${ARCH}" \
            main.py
          cd dist
          tar -czf "../querii-macOS-${ARCH}.tar.gz" "querii-macOS-${ARCH}"
        fi

    # ── Windows: onedir bundle (required by Inno Setup) ────────────────
    - name: Build Executable (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconfirm --onedir --windowed `
          --add-data "web;web" `
          --name querii-windows `
          main.py

    # ── Windows: build installer with Inno Setup ───────────────────────
    - name: Build Windows Installer
      if: runner.os == 'Windows'
      run: |
        choco install innosetup --no-progress -y
        iscc installer.iss

    - name: Upload Artifacts (Linux/macOS)
      if: runner.os != 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: binaries-${{ matrix.os }}
        path: querii-*.tar.gz
        retention-days: 1

    - name: Upload Artifacts (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: binaries-Windows
        path: dist/querii-windows-setup.exe
        retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          pattern: binaries-*
          merge-multiple: true

      - name: List downloaded files
        run: find binaries -type f

      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v4.2
          name: Querii Version 4.2
          fail_on_unmatched_files: false
          body: |
            ## ⚡ Querii Version 4.2 (Official Release)

            **Querii Version 4.2** delivers major enhancements across spreadsheet creation, multi-platform binary compilation (native macOS Apple Silicon arm64 & Intel x86_64), intelligent column sizing, and executive PDF reporting workflows.

            ---

            ### 🚀 What's New in Version 4.2

            #### 1. 📊 Next-Gen Spreadsheet CSV Studio
            - **Batch Row & Column Additions**: Numeric counter inputs (`N`) alongside `+ Row(s)` and `+ Col(s)` allow instant creation of large tables.
            - **Accessible Row & Column Deletion**: Dedicated `🗑 Del Row` and `🗑 Del Col` toolbar controls, plus direct inline `×` removal buttons on row numbers and column headers.
            - **Spreadsheet Clipboard Integration**: Direct copy-paste of tabular data directly into cells, respecting headers, tabs, and commas.

            #### 2. 🎨 Executive PDF Studio & Smart Layout
            - **Token-Aware Column Auto-Width & Smart Header Shortening**: Column widths are calculated from the longest first token across rows. When column headers exceed content widths, a single-click checkbox gracefully truncates names (`abcd..`), immediately reflected in the column sliders.
            - **Export-Only Rows & Columns**: Inject blank rows (for physical signatures/forms) and add custom columns without mutating the underlying SQLite database.
            - **Organisation & Watermark Priority**: Live custom organisation updates seamlessly synchronize with export metadata and dense anti-tamper watermark text.
            - **Logo Inclusion Toggle**: Checkbox to toggle branding logos on/off across both the header masthead and repeating watermarks.

            #### 3. 🍎 Multi-Architecture macOS & Windows Packaging
            - **Native macOS Apple Silicon (arm64)**: Built for M1, M2, M3, and M4 Macs with native performance.
            - **Native macOS Intel (x86_64)**: Dedicated native binaries for legacy Intel-based Macs.
            - **Windows Uninstaller**: Start Menu and Add/Remove Programs uninstaller shortcut registered via Inno Setup.

            ---

            ### 📥 Downloads

            | Platform | Architecture | File | Notes |
            |---|---|---|---|
            | 🐧 Linux | x86_64 | `querii-Linux.tar.gz` | Extract and run `querii-linux` (zero system GTK conflict) |
            | 🍎 macOS | Apple Silicon (M1/M2/M3/M4) | `querii-macOS-arm64.tar.gz` | Extract and run `querii-macOS-arm64` |
            | 🍎 macOS | Intel (x86_64) | `querii-macOS-x86_64.tar.gz` | Extract and run `querii-macOS-x86_64` |
            | 🪟 Windows | x64 | `querii-windows-setup.exe` | Windows Installer with Start Menu, Desktop & Uninstall shortcuts |

            > **Data Persistence:** Your database and configurations persist safely across versions in:
            > - Windows: `%APPDATA%\Querii\`
            > - Linux: `~/.local/share/querii/`
            > - macOS: `~/Library/Application Support/Querii/`
          files: |
            binaries/*.tar.gz
            binaries/querii-windows-setup.exe

