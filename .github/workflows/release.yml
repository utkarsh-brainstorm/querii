name: Build and Release Querii

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgirepository1.0-dev gcc libcairo2-dev pkg-config python3-dev gir1.2-gtk-3.0
        sudo apt-get install -y gir1.2-webkit2-4.1 || sudo apt-get install -y gir1.2-webkit2-4.0

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pywebview reportlab openpyxl xlrd pyinstaller

    # ── Linux: shiv ZipApp / macOS: PyInstaller onedir ──────────────
    - name: Build Executable (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          # Build a lightweight pure-Python ZipApp for Linux. 
          # Bypasses all PyInstaller GTK library stripping/sandbox crashes.
          python3 -m pip install shiv pywebview reportlab openpyxl xlrd
          mkdir dist
          shiv -p '/usr/bin/python3' -o dist/querii-linux pywebview reportlab openpyxl xlrd --site-packages . -e main:main
          cd dist
          tar -czf ../querii-Linux.tar.gz querii-linux
        else
          # macOS uses standard PyInstaller
          pip install pywebview reportlab openpyxl xlrd pyinstaller
          pyinstaller --noconfirm --onedir --windowed \
            --add-data "web:web" \
            --name querii-macOS \
            main.py
          cd dist
          tar -czf ../querii-macOS.tar.gz querii-macOS
        fi

    # ── Windows: onedir bundle (required by Inno Setup) ────────────────
    - name: Build Executable (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconfirm --onedir --windowed `
          --add-data "web;web" `
          --name querii-windows `
          main.py

    # ── Windows: build installer with Inno Setup ───────────────────────
    - name: Build Windows Installer
      if: runner.os == 'Windows'
      run: |
        choco install innosetup --no-progress -y
        iscc installer.iss

    - name: Upload Artifacts (Linux/macOS)
      if: runner.os != 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: binaries-${{ runner.os }}
        path: querii-${{ runner.os }}.tar.gz
        retention-days: 1

    - name: Upload Artifacts (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: binaries-Windows
        path: dist/querii-windows-setup.exe
        retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          pattern: binaries-*
          merge-multiple: true

      - name: List downloaded files
        run: find binaries -type f

      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v4.0
          name: Querii Version 4.0
          fail_on_unmatched_files: false
          body: |
            ## ⚡ Querii Version 4.0 (Official Release)

            **Querii Version 4.0** is the major milestone release of Querii — the high-velocity, local-first SQL analytics workstation and executive reporting studio. This release introduces a dual-engine vector/Chromium PDF pipeline, the redesigned Ultra Dev Mode PDF editor with live physical page sheet geometry, interactive mouse-drag column resizing, built-in executive Libron typography, robust desktop clipboard integration, and complete design freedom via custom CSS.

            ---

            ### 🚀 Highlights & Major Features in Version 4.0

            #### 1. ⚡ Dual-Engine PDF Generation Pipeline
            - **Native Rust Vector Engine (`core/querii-pdf`)**: Renders 1,000+ records across dozens of pages in **under 35 ms** — over 350× faster than traditional tools with pure vector graphics and zero external runtime dependencies.
            - **Executive Headless Chromium Studio**: High-fidelity publication-grade PDF reporting with paged media, executive masthead, dual accent lines, and metadata matrix.
            - **Fallback Guarantee**: Graceful multi-tier fallback to ReportLab ensuring 100% export reliability across all environments.

            #### 2. 🎨 Ultra Dev Mode & Interactive PDF Studio
            - **Physical Page Sheet Geometry**: Exact physical paper dimensions (A4 210×297mm, A3 297×420mm, Letter 216×279mm) with studio dark canvas background, realistic paper border, and authentic page boundaries.
            - **Responsive Zoom Controls**: One-click **Fit Page** (dynamically scales to fit the viewport), **75%**, and **100%** with a live Paper Info Badge (`📄 A4 Portrait — 210 × 297 mm`).
            - **Interactive Column Drag Resizing**: Hold and drag vertical column divider borders directly on the table header with mouse; resizes adjacent columns simultaneously to strictly conserve 100% table layout.
            - **Keyboard Width Inputs**: Numeric percentage inputs alongside sliders for precise column width adjustments.
            - **Bold Table Data & Vertical Lines Toggles**: Dedicated controls to toggle font weight and vertical column grid lines in the final PDF.

            #### 3. 🏢 100% Custom CSS Freedom & 1-Click Presets
            - **Complete Cascade Control**: Custom CSS injected with zero blocking `!important` locks, giving users 100% freedom over element placement, paddings, margins, `@page` rules, and typography.
            - **5 Executive Style Presets**: Direct selection in both the PDF Export Modal and Ultra Dev Mode:
              - `🏢 Slate` — Executive Slate palette with deep navy accents
              - `📰 Minimal` — Financial minimal monospace aesthetic
              - `🌲 Emerald` — Corporate emerald styling
              - `🟣 Tech` — Modern indigo and violet layout
              - `📏 Compact` — Ultra-dense layout for wide tables
            - **Save as Default**: One-click `💾 Set as Default` button saves custom styles directly to settings.

            #### 4. 🤖 AI Specification Generator with Hard Exceptions
            - Rewritten prompt generator producing an exhaustive specification of the HTML hierarchy, CSS variables, geometry, and columns.
            - Explicit **6 Hard Exceptions** preventing layout pagination bugs in AI-generated custom stylesheets.
            - Native clipboard copy via `pyperclip` and PyQt6 system clipboard, completely eliminating Qt permission errors.

            #### 5. 🔍 Client-Side Global Search & SQL Analytics
            - Browser-like **Ctrl+F** global search across all columns with real-time text highlighting and keyboard Enter navigation.
            - SQL schema column injection with smart leading comma formatting.
            - Comprehensive database engine support (SQLite, MySQL, PostgreSQL).

            ### 📥 Downloads
            Pick the file for your OS — no Python or dependencies needed.

            | Platform | File | Notes |
            |---|---|---|
            | 🐧 Linux | `querii-Linux.tar.gz` | Extract the archive, then run the `querii-Linux` executable inside |
            | 🍎 macOS | `querii-macOS.tar.gz` | Extract the archive, then run the `querii-macOS` executable inside |
            | 🪟 Windows | `querii-windows-setup.exe` | Run the installer — adds to Start Menu & optional Desktop icon |

            > **Data location:** Your database and settings are stored in your user profile, never inside the app folder.
            > - Windows: `%APPDATA%\Querii\`
            > - Linux: `~/.local/share/querii/`
            > - macOS: `~/Library/Application Support/Querii/`
          files: |
            binaries/*.tar.gz
            binaries/querii-windows-setup.exe

